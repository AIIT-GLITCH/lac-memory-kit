[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lac"
version = "1.0.0"
description = "Lateral Autonomous Cognition — memory + browser kit, distilled from Gary and Lil Homie."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Rhet Wike", email = "reliablerestaurantrepair@gmail.com"},
]
keywords = ["llm", "memory", "agent", "claude", "anthropic", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
    "anthropic>=0.39",
]

[project.urls]
Homepage = "https://aiit-threshold.com"

[tool.setuptools.packages.find]
include = ["lac*"]
